name: CI/CD Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure Linux VM
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands for deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "==> Arrivée sur la VM Azure..."
            cd /home/lbetancourtd/WonderWord-UNI
            
            echo "==> Récupération des dernières modifications (git pull)..."
            git pull origin main
            
            echo "==> Mise à jour des variables d'environnement..."
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" > .env
            
            echo "==> Reconstruction et redémarrage des conteneurs Docker..."
            docker compose up -d --build
            
            echo "==> Nettoyage des anciennes images Docker orphelines..."
            docker image prune -f
            
            echo "==> Déploiement terminé avec succès sur https://wonderword.luisbetancourt.fr !"
