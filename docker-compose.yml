services:
  # 1. Frontend React (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: wonderword-client
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - wonderword-network

  # 2. Backend API (Fastify + Prisma)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wonderword-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://wonderword:wonderword@postgres:5432/wonderword
      - JWT_SECRET=${JWT_SECRET:-wonderword-production-secret-2026}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-WonderWord <onboarding@resend.dev>}
      - APP_URL=${APP_URL:-https://wonderword.luisbetancourt.fr}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wonderword-network

  # 3. Base de données PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: wonderword-postgres
    restart: always
    environment:
      POSTGRES_USER: wonderword
      POSTGRES_PASSWORD: wonderword
      POSTGRES_DB: wonderword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonderword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wonderword-network

networks:
  wonderword-network:
    driver: bridge

volumes:
  pgdata:
